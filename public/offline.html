<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#050606">
<title>You're offline | Golafly Matchday</title>
<!-- Shown by the service worker (public/sw.js) when a page can't be reached.
     Self-contained on purpose: no scripts or styles from the app, because
     those may not be available offline. -->
<style>
  :root {
    --bg: #fafaf7;
    --fg: #121212;
    --muted: #5d5d58;
    --line: rgba(18, 18, 18, 0.15);
    --brand: #b7ff00;
    --brand-edge: #8fcc00;
    --ink: #050606;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #050606;
      --fg: #f4f4ef;
      --muted: #a3a39c;
      --line: rgba(244, 244, 239, 0.18);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    overflow: hidden;
  }
  .mark {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Impact, "Arial Narrow Bold", "Helvetica Neue Condensed", sans-serif;
    font-size: clamp(80px, 21vw, 300px);
    letter-spacing: 0.02em;
    line-height: 1;
    color: var(--fg);
    opacity: 0.05;
    user-select: none;
    pointer-events: none;
  }
  main { position: relative; width: 100%; max-width: 440px; text-align: center; }
  .icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 64px;
    height: 64px;
    border-radius: 50%;
    border: 1px solid var(--line);
    color: var(--fg);
  }
  h1 {
    margin: 24px 0 0;
    font-size: clamp(30px, 7vw, 40px);
    font-weight: 700;
    line-height: 1.1;
    letter-spacing: -0.02em;
  }
  p { margin: 16px auto 0; font-size: 16px; line-height: 1.55; color: var(--muted); }
  button {
    margin-top: 32px;
    height: 48px;
    padding: 0 32px;
    border: 0;
    border-radius: 999px;
    background: var(--brand);
    color: var(--ink);
    font: inherit;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: inset 0 0 0 1px var(--brand-edge);
    transition: filter 0.2s, transform 0.2s;
  }
  button:hover { filter: brightness(0.95); }
  button:active { transform: scale(0.98); }
  button:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) { button { transition: none; } }
</style>
</head>
<body>
  <div class="mark" aria-hidden="true">OFFLINE</div>
  <main>
    <span class="icon" aria-hidden="true">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 20h.01"/>
        <path d="M8.5 16.4a5 5 0 0 1 7 0"/>
        <path d="M5 12.9a10 10 0 0 1 5.2-2.7"/>
        <path d="M19 12.9a10 10 0 0 0-1.9-1.5"/>
        <path d="M2 8.8a15 15 0 0 1 4.2-2.6"/>
        <path d="M22 8.8a15 15 0 0 0-9.4-3.7"/>
        <path d="m2 2 20 20"/>
      </svg>
    </span>
    <h1>You're offline</h1>
    <p>Golafly Matchday needs a connection to show live ticket prices and availability. Check your connection, then try again.</p>
    <button type="button" id="retry">Try again</button>
  </main>
  <script>
    document.getElementById('retry').addEventListener('click', function () { location.reload(); });
    window.addEventListener('online', function () { location.reload(); });
  </script>
</body>
</html>
